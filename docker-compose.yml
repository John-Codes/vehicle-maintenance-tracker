services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  tracker-api:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: tracker_local
      COLLECTION: items
      APP_API_KEY: change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports: ["8010:8010"]
    depends_on: [mongo]

  tracker-web:
    build: .
    environment:
      API_URL: http://tracker-api:8010
      PORT: 8080
    ports: ["8080:8080"]
    depends_on: [tracker-api]

volumes:
  mongo-data:
