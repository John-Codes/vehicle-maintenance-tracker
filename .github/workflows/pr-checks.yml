name: pr-checks
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://localhost:27017
      DB_NAME: tracker_dev
      COLLECTION: items
      APP_API_KEY: ci-dev-key
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Flutter analyze
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test
      - name: Landing build check
        working-directory: landing
        run: |
          npm ci
          npm run build
      - name: Install Playwright for browser e2e
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Backend e2e against throwaway dev DB
        working-directory: backend
        env:
          API_URL: http://127.0.0.1:8011
          APP_API_KEY: ci-dev-key
          REVIEW_URL: http://127.0.0.1:8092
        run: |
          pip install -r requirements.txt
          uvicorn app.main:app --host 127.0.0.1 --port 8011 &
          UVPID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8011/health >/dev/null && break; sleep 2; done
          for test in e2e_*.py; do
            case "$test" in
              *_browser.py)
                echo "=== Skipping $test: requires a running Flutter web app at REVIEW_URL (not provisioned in CI) ==="
                continue
                ;;
            esac
            echo "=== Running $test ==="
            python "$test"
          done
          kill $UVPID
